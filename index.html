<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muziekhandel Simone</title>
  <meta name="description" content="Speel, luister en ontdek muziek in een oude muziekwinkel in Middelburg, rond 1900.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Music&family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="stage"></canvas>
    <div id="hud">
      <div class="hud-right">
        <span id="piano-status" class="hud-chip" hidden>Piano wordt gestemd…</span>
        <button class="hud-btn" id="btn-help" title="Hulp van Meneer Simone">?</button>
        <button class="btn brass small" id="btn-skip" title="Sla het verhaal over (Esc)">Overslaan <span class="ico">⏭</span></button>
      </div>
    </div>
    <div class="hud-chip rotate-hint">Draai je scherm voor het mooiste beeld</div>
    <div id="overlay" hidden></div>
    <div id="fade"></div>

    <section id="title-screen">
      <div class="title-bg"></div>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <linearGradient id="gilt" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#fff1bd"/><stop offset=".35" stop-color="#e9bd5c"/>
            <stop offset=".6" stop-color="#a87a2e"/><stop offset="1" stop-color="#f2cf7a"/>
          </linearGradient>
          <!-- a lyre, as painted on the shop's sign -->
          <g id="lyre" fill="none" stroke="url(#gilt)" stroke-linecap="round">
            <path d="M19 70 C8 54 6 32 14 20 C17 15 14 9 8 11" stroke-width="4.2"/>
            <path d="M41 70 C52 54 54 32 46 20 C43 15 46 9 52 11" stroke-width="4.2"/>
            <path d="M12 25 Q30 21 48 25" stroke-width="3.4"/>
            <path class="strings" d="M24 24 V68 M28 23.5 V69 M32 23.5 V69 M36 24 V68" stroke-width="1.3"/>
            <path d="M17 68 Q30 75 43 68" stroke-width="4.2"/>
            <path d="M23 77 H37" stroke-width="4.6"/>
            <path d="M30 72 V77" stroke-width="3.4"/>
          </g>
        </defs>
      </svg>
      <div class="title-main">
        <div class="title-sign">
          <span class="sign-chain left" aria-hidden="true"></span><span class="sign-chain right" aria-hidden="true"></span>
          <svg class="lyre" viewBox="0 0 60 84" aria-hidden="true"><use href="#lyre"/></svg>
          <h1><span class="sign-small">Muziekhandel</span><span class="sign-name">Simone</span></h1>
          <svg class="lyre" viewBox="0 0 60 84" aria-hidden="true"><use href="#lyre"/></svg>
          <span class="sign-since">sinds 1892 · Middelburg</span>
        </div>
        <p class="title-sub">Speel, luister en ontdek muziek in Middelburg, rond 1900.</p>
        <button class="btn brass" id="btn-start"><span class="ico" aria-hidden="true">▶</span> Start</button>
        <p class="title-keys">← → lopen &nbsp;·&nbsp; ↑ of Enter: naar binnen / bekijken &nbsp;·&nbsp; Esc: terug</p>
      </div>
    </section>
  </div>

  <!-- Hand-drawn edge filter used by paper cards -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
  </svg>

  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
